# Layered on top of openshorts/docker-compose.yml by the clipper script.
# Relative paths resolve from openshorts/ (the compose project directory).
# Needs Docker Compose 2.24+ for !override / !reset (any Docker Desktop from 2024 on).
services:
  backend:
    env_file:
      - path: ../.env
        required: true
    environment:
      CLIPPER_LOCAL_KEYS: "1"       # dashboard picks the keys up from .env
    # Only this machine can reach the API (self-host CORS is "*").
    ports: !override
      - "127.0.0.1:8000:8000"
    volumes:
      - ../stack:/stack:ro          # run_job.py
      - ../clips:/clips             # finished clips, copied per job
      - ../recordings:/recordings   # point OBS's recording path here
      # Heavy video I/O and model weights live in Docker volumes, not on a
      # Windows bind mount (several times faster, and models download once).
      - clipper_output:/app/output
      - clipper_uploads:/app/uploads
      - clipper_models:/app/.cache

  frontend:
    build:
      context: ./dashboard
      target: prod                  # static build served by nginx, no dev server
    volumes: !override
      - ../stack/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: !override
      - "127.0.0.1:5175:80"

  renderer:
    ports: !override
      - "127.0.0.1:3100:3100"

volumes:
  clipper_output:
  clipper_uploads:
  clipper_models:
