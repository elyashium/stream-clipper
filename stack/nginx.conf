# Local dashboard: the production build of OpenShorts' dashboard, plus the
# proxying the Vite dev server would otherwise do. Much lighter than running
# Vite with HMR over a Windows bind mount.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    client_max_body_size 0;          # stream recordings are many GB
    proxy_request_buffering off;     # stream uploads straight through
    proxy_buffering off;             # live job logs, video range requests
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location ~ ^/(api|videos|thumbnails|gallery|video|mcp)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location /render {
        proxy_pass http://renderer:3100;
        proxy_http_version 1.1;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
